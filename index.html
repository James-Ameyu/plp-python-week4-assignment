<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="page-heading">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <section class="card">
        <h2>Add Expense</h2>

        <form>
            <label for="expense-name">Expense Name</label>
            <input type="text" id="expense-name" placeholder="Enter expense name">

            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Enter amount">

            <label for="category">Category</label>
            <select id="category">
                <option>Food</option>
                <option>Transport</option>
                <option>Rent</option>
                <option>Entertainment</option>
                <option>Other</option>
            </select>

            <button type="submit">Add Expense</button>
        </form>
    </section>

    <section class="card">
        <h2>Your Expenses</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Lunch</td>
                    <td>KSh 500</td>
                    <td>Food</td>
                    <td>2026-10-01</td>
                </tr>

                <tr>
                    <td>Bus Fare</td>
                    <td>KSh 200</td>
                    <td>Transport</td>
                    <td>2026-10-01</td>
                </tr>

                <tr>
                    <td>Rent</td>
                    <td>KSh 8,000</td>
                    <td>Rent</td>
                    <td>2026-10-01</td>
                </tr>

                <tr>
                    <td>Movie</td>
                    <td>KSh 1,000</td>
                    <td>Entertainment</td>
                    <td>2026-10-01</td>
                </tr>

                <tr>
                    <td>Groceries</td>
                    <td>KSh 2,500</td>
                    <td>Food</td>
                    <td>2026-10-01</td>
                </tr>
            </tbody>
        </table>
    </section>

</body>
</html>
